# CI Pipeline
# On every push/PR: checkout, install deps, run tests, build Docker image, push to registry
name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_IMAGE_NAME: cats-vs-dogs-classifier
  PYTHON_VERSION: "3.14"

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Create mock model for tests
        run: |
          mkdir -p models
          python -c "
          import torch, sys
          sys.path.insert(0, '.')
          from src.models.cnn_model import CNNBaseline
          m = CNNBaseline(num_classes=2)
          m.eval()
          torch.save(m.state_dict(), 'models/model.pt')
          print('Mock model saved.')
          "

      - name: Run unit tests with pytest
        run: |
          python -m pytest tests/ -v --cov=src --cov=api --cov-report=term-missing --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  lint:
    name: Lint Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install linting tools
        run: pip install flake8 black

      - name: Run flake8
        run: flake8 src/ tests/ api/ --max-line-length=100 --ignore=E231,E203,W503,E402

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # models/model.pt is gitignored (trained locally), but the Dockerfile
      # COPYs models/ into the image. Generate a valid state dict so the
      # image always builds in CI.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install torch for model artifact
        run: pip install torch==2.9.1

      - name: Create model artifact for Docker build
        run: |
          mkdir -p models
          python -c "
          import torch, sys
          sys.path.insert(0, '.')
          from src.models.cnn_model import CNNBaseline
          m = CNNBaseline(num_classes=2)
          torch.save(m.state_dict(), 'models/model.pt')
          print('Model artifact saved.')
          "

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
